name: Engine validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - run: python -m pip install -r scripts/requirements-test.txt
      - if: runner.os != 'Windows'
        run: python scripts/validate.py target/release/deep-lantern
      - if: runner.os == 'Windows'
        run: python scripts/validate.py target/release/deep-lantern.exe
      - if: runner.os != 'Windows'
        run: python scripts/validate_features.py target/release/deep-lantern
      - if: runner.os == 'Windows'
        run: python scripts/validate_features.py target/release/deep-lantern.exe
      - uses: actions/upload-artifact@v4
        with:
          name: deep-lantern-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/deep-lantern
            target/release/deep-lantern.exe
          if-no-files-found: error
